name: Build

# Builds Nightdock for Windows and Linux.
# - Every push and pull request: build and keep the files as a downloadable artifact.
# - A push to main with a new version number in package.json: publish a GitHub Release
#   (tag v<version>) with all files. Pushing a version tag by hand does the same.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: newer rpm versions (4.20+) change rpmbuild's folder layout and break the .rpm build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis rpm libarchive-tools zip

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run dist:win

      # The Linux formats are built one at a time: building them in parallel makes
      # them clash over temporary files.
      - name: Build Linux app folder
        run: npx electron-builder --linux dir

      - name: Build AppImage and tar.gz
        run: |
          npx electron-builder --linux AppImage --prepackaged dist/linux-unpacked
          npx electron-builder --linux tar.gz --prepackaged dist/linux-unpacked

      - name: Build .deb (Debian, Ubuntu, Mint)
        run: npx electron-builder --linux deb --prepackaged dist/linux-unpacked

      - name: Build .pkg.tar.xz (Arch, CachyOS, Manjaro)
        run: npx electron-builder --linux pacman --prepackaged dist/linux-unpacked

      # A broken .rpm shouldn't stop the release for everyone else.
      - name: Build .rpm (Fedora, openSUSE)
        id: rpm
        continue-on-error: true
        run: npx electron-builder --linux rpm --prepackaged dist/linux-unpacked

      # If the .rpm failed, show rpmbuild's own error as an annotation on the build page.
      - name: Explain .rpm failure
        if: steps.rpm.outcome == 'failure'
        continue-on-error: true
        run: |
          DEBUG=electron-builder npx electron-builder --linux rpm --prepackaged dist/linux-unpacked > rpm-debug.log 2>&1 || true
          grep -iE "error|warning:|failed|not found|cannot|denied|No such" rpm-debug.log | tail -12 | cut -c1-300 | while IFS= read -r line; do echo "::warning title=rpm::$line"; done
          rpmbuild --version || true

      # Clear file names: "Windows" or "Linux" in each name, and no version number, so links like
      # .../releases/latest/download/nightdock-x86_64.pkg.tar.xz always get the newest version.
      # (The Arch package keeps its short name so the published pacman command keeps working.)
      - name: Give the files clear names
        run: |
          cd dist
          mv Nightdock-Setup-*.exe Nightdock-Windows-Setup.exe
          mv Nightdock-Portable-*-windows.zip Nightdock-Windows-Portable.zip
          mv Nightdock-*-linux-x86_64.AppImage Nightdock-Linux-x86_64.AppImage
          mv Nightdock-*-linux-x64.tar.gz Nightdock-Linux-x64.tar.gz
          mv nightdock_*_amd64.deb Nightdock-Linux-Ubuntu-Debian.deb
          mv nightdock-*-x86_64.pkg.tar.xz nightdock-x86_64.pkg.tar.xz
          if ls nightdock-*.x86_64.rpm >/dev/null 2>&1; then mv nightdock-*.x86_64.rpm Nightdock-Linux-Fedora.rpm; fi
          ls -la

      - name: Is this a new version?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: nightdock-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.xz
            dist/*.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nightdock ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            **Windows:** download [`Nightdock-Windows-Setup.exe`](https://github.com/${{ github.repository }}/releases/latest/download/Nightdock-Windows-Setup.exe) and run it (or the portable zip).

            **CachyOS / Arch / Manjaro:**
            ```
            curl -fLO https://github.com/${{ github.repository }}/releases/latest/download/nightdock-x86_64.pkg.tar.xz && sudo pacman -U nightdock-x86_64.pkg.tar.xz
            ```

            **Any Linux:**
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Files: everything named `Windows` is for Windows; everything named `Linux`, plus `nightdock-x86_64.pkg.tar.xz` (Arch/CachyOS), is for Linux.
            Nightdock 1.4.0 and newer can also update itself: Settings → Updates.

            What's new: see the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.xz
            dist/*.tar.gz
