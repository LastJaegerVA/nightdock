name: Translation fix
description: A word or sentence that sounds wrong in your language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Deutsch
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What it says now
      description: Copy the text, or describe where in the app you saw it.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What it should say
    validations:
      required: true
