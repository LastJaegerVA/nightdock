name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: input
    id: system
    attributes:
      label: Your system
      placeholder: e.g. Windows 11, CachyOS, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nightdock version
      description: Shown at the bottom of Settings.
      placeholder: e.g. 1.3.0
    validations:
      required: true
  - type: input
    id: launcher
    attributes:
      label: Which launcher is it about? (if any)
      placeholder: e.g. Ubisoft Connect installed through Lutris
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
